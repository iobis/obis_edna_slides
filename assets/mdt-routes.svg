<svg viewBox="0 0 1000 300" role="img" aria-labelledby="mdt-routes-title" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mdt-routes-title">Two routes into the IPT: through the MDT, or straight there with tabular files</title>
  <defs>
    <marker id="mdtArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C757D"/>
    </marker>
  </defs>
  <!-- route one: through the MDT -->
  <text x="10" y="88" font-size="15" font-weight="600" fill="#0E9E82" letter-spacing="0.06em">WITH MDT</text>
  <rect x="170" y="50" width="220" height="64" rx="8" fill="#F8F9FA" stroke="#DEE2E6"/>
  <text x="280" y="88" text-anchor="middle" font-size="18" fill="#156082">eDNA standard outputs</text>
  <line x1="392" y1="82" x2="432" y2="82" stroke="#6C757D" stroke-width="2" marker-end="url(#mdtArrow)"/>
  <rect x="440" y="50" width="140" height="64" rx="8" fill="#E9FBF7" stroke="#0E9E82" stroke-width="2"/>
  <text x="510" y="88" text-anchor="middle" font-size="20" font-weight="600" fill="#0E9E82">MDT</text>
  <line x1="582" y1="82" x2="622" y2="82" stroke="#6C757D" stroke-width="2" marker-end="url(#mdtArrow)"/>
  <rect x="630" y="50" width="140" height="64" rx="8" fill="#F8F9FA" stroke="#DEE2E6"/>
  <text x="700" y="88" text-anchor="middle" font-size="20" font-weight="600" fill="#156082">IPT</text>
  <text x="510" y="140" text-anchor="middle" font-size="15" fill="#0E9E82">MDT does the Darwin Core mapping</text>
  <!-- route two: straight to the IPT -->
  <text x="10" y="228" font-size="15" font-weight="600" fill="#6C757D" letter-spacing="0.06em">STRAIGHT TO IPT</text>
  <rect x="170" y="190" width="220" height="64" rx="8" fill="#F8F9FA" stroke="#DEE2E6"/>
  <text x="280" y="228" text-anchor="middle" font-size="18" fill="#156082">Tabular files</text>
  <line x1="392" y1="222" x2="622" y2="222" stroke="#6C757D" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mdtArrow)"/>
  <rect x="630" y="190" width="140" height="64" rx="8" fill="#F8F9FA" stroke="#DEE2E6"/>
  <text x="700" y="228" text-anchor="middle" font-size="20" font-weight="600" fill="#156082">IPT</text>
  <text x="510" y="280" text-anchor="middle" font-size="15" fill="#6C757D">you do the Darwin Core mapping yourself</text>
  <!-- new arrow: eDNA standard outputs -> Tabular files, labeled "Wrangle" -->
  <line x1="280" y1="114" x2="280" y2="186" stroke="#6C757D" stroke-width="2" marker-end="url(#mdtArrow)"/>
  <rect x="248" y="138" width="64" height="20" fill="#FFFFFF"/>
  <text x="280" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#6C757D">Wrangle</text>
</svg>
